name: Build Images

on:
  push:
    tags:
    - '*_*'
    branches-ignore:
    - '*'
  workflow_dispatch:
    inputs:
      runtime:
        description: 'Runtimes to build'
        type: choice
        required: true
        default: all
        options:
        - all
        - common
        - python
        - nodejs
        - java
        - php
        - experimental

jobs:
  images:
    name: Build OpenServerless runtime images
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check GHCR_TOKEN is set
        if: ${{ github.repository_owner != 'apache' }}
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            {
              echo "## Missing required secret: GHCR_TOKEN"
              echo
              echo "This repository publishes multiple images whose names do not"
              echo "match the repository (openserverless-runtime-common, -go,"
              echo "-python, -nodejs, -java, -php). The built-in GITHUB_TOKEN only"
              echo "has write access to packages owned by this repository, so it"
              echo "cannot push them: the push would fail with"
              echo '`denied: permission_denied: write_package`.'
              echo
              echo "To fix this, create a Personal Access Token and add it as a secret:"
              echo
              echo "1. Go to https://github.com/settings/tokens"
              echo "   -> Generate new token (classic)"
              echo "2. Select the **write:packages** scope"
              echo "3. Copy the generated token"
              echo "4. In this repository go to"
              echo "   Settings -> Secrets and variables -> Actions -> New repository secret"
              echo "5. Name it exactly **GHCR_TOKEN** and paste the token as the value"
              echo
              echo "Then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing GHCR_TOKEN::This repository publishes multiple images and needs a PAT with write:packages stored as the secret GHCR_TOKEN. See the job summary for step-by-step instructions."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # full history and tags: "task tag" replaces the existing tags
          # and "git describe" needs them to be present
          fetch-depth: 0
      - name: License
        uses: apache/skywalking-eyes@v0.9.0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Setup CI
        run: bash .github/cisetup.sh
      - name: Use ghcr.io repo
        if: ${{ github.repository_owner != 'apache' }}
        run: |
          echo "REPO_URL=ghcr.io" >> "$GITHUB_ENV"
          echo "REGISTRY_USER=${{ github.actor }}" >> "$GITHUB_ENV"
          echo "DOCKERHUB_REGISTRY=ghcr.io" >> "$GITHUB_ENV"
          echo "DOCKERHUB_USER=${{ github.repository_owner }}" >> "$GITHUB_ENV"
      - name: Use docker.io repo
        if: ${{ github.repository_owner == 'apache' }}
        run: |
          echo "REPO_URL=docker.io" >> "$GITHUB_ENV"
          echo "REGISTRY_USER=${{ secrets.DOCKERHUB_USER }}" >> "$GITHUB_ENV"
          echo "DOCKERHUB_REGISTRY=docker.io" >> "$GITHUB_ENV"
          echo "DOCKERHUB_USER=apache" >> "$GITHUB_ENV"
      # the Taskfile reads DOCKERHUB_REGISTRY and DOCKERHUB_USER from .env
      - name: Create .env
        run: |
          {
            echo "DOCKERHUB_REGISTRY=$DOCKERHUB_REGISTRY"
            echo "DOCKERHUB_USER=$DOCKERHUB_USER"
          } > .env
          cat .env
      - name: Registry login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REPO_URL }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ github.repository_owner == 'apache' && secrets.DOCKERHUB_TOKEN || secrets.GHCR_TOKEN }}
      # Manual run: create a new snapshot tag on the current HEAD for the
      # selected runtimes. The tag is not pushed, so no second run is started:
      # this same run goes on and builds it.
      - name: Tag HEAD (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          task tag RT="${{ inputs.runtime }}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push
        run: task buildx
